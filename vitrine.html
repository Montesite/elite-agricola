<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark:       #16240F;
      --green:      #367C2B;
      --green-dark: #275A20;
      --yellow:     #FFDE00;
      --yellow-dark:#D9BE00;
      --white:      #FFFFFF;
      --gray-200:   #E4E4E4;
      --text:       #1F1F1F;
      --header-h: 80px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--white);
    }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }

    /* ===== HEADER ===== */
    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 900;
      height: var(--header-h); width: 100%;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 18px rgba(22,36,15,0.12);
      display: flex; align-items: center;
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px; gap: 16px;
    }
    .header-logo { display: flex; align-items: center; }
    .header-logo img { height: 52px; width: auto; }

    .header-nav { display: flex; align-items: center; gap: 4px; }
    .header-nav a {
      font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.82rem;
      color: var(--text); letter-spacing: 0.01em;
      padding: 8px 12px; border-radius: 7px;
      transition: color 0.2s, background 0.2s;
    }
    .header-nav a:hover { color: var(--green-dark); background: rgba(54,124,43,0.08); }
    .header-nav a.active {
      color: var(--green-dark); background: rgba(54,124,43,0.10);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .header-nav a.active svg { width: 14px; height: 14px; }

    .header-wa {
      display: flex; align-items: center; gap: 8px;
      background: var(--green); color: var(--white);
      padding: 10px 20px; border-radius: 8px;
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.82rem;
      transition: background 0.2s, transform 0.15s;
    }
    .header-wa:hover { background: var(--green-dark); transform: translateY(-1px); }
    .header-wa svg { width: 16px; height: 16px; flex-shrink: 0; }

    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; background: none; border: none; padding: 6px; z-index: 910;
    }
    .hamburger span {
      display: block; width: 24px; height: 2px; border-radius: 2px;
      background: var(--dark); transition: transform 0.3s, opacity 0.3s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-nav {
      display: none; position: fixed; inset: 0; z-index: 895;
      background: var(--dark); flex-direction: column;
      align-items: center; justify-content: center; gap: 26px;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a {
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.2rem;
      color: var(--white); text-transform: uppercase; letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    .mobile-nav a:hover, .mobile-nav a.active { color: var(--yellow); }
    .mobile-nav .mob-wa {
      background: var(--green); color: var(--white);
      padding: 13px 30px; border-radius: 50px; font-size: 0.95rem;
      margin-top: 10px;
    }

    @media (max-width: 900px) {
      .header-inner { padding: 0 20px; }
      .header-nav, .header-wa { display: none; }
      .hamburger { display: flex; }
    }

    /* ===== IFRAME ===== */
    #vitrineIframe {
      display: block;
      width: 100%;
      border: none;
      margin-top: var(--header-h);
    }
  </style>
</head>
<body>

      </nav>
      <a href="https://wa.me/5555999042002" target="_blank" rel="noopener noreferrer" class="header-wa">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>

  <!-- MENU MOBILE -->

  <!-- VITRINE -->
  <iframe
    id="vitrineIframe"
    src="https://elitepecasagricolas.egestor.com.br/vitrine/"
    style="width:100%; height:800px; border:none;"
    title="Vitrine online Elite Agrícola"
    allowfullscreen
  ></iframe>

  <script>
    var ham = document.getElementById('hamburger');
    var mob = document.getElementById('mobileNav');
    ham.addEventListener('click', function() {
      var open = ham.classList.toggle('open');
      mob.classList.toggle('open');
      ham.setAttribute('aria-expanded', open);
    });
    document.querySelectorAll('.mobile-nav a').forEach(function(a) {
      a.addEventListener('click', function() {
        ham.classList.remove('open');
        mob.classList.remove('open');
        ham.setAttribute('aria-expanded', 'false');
      });
    });

    /* Altura do iframe = altura da janela - header (sem badge MonteSite nesta página) */
    function setVitrineHeight() {
      var iframe = document.getElementById('vitrineIframe');
      if (!iframe) return;
      iframe.style.height = (window.innerHeight - 80) + 'px';
    }
    window.addEventListener('resize', setVitrineHeight);
    setVitrineHeight();
  </script>
